
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>My 3D Open City</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;font-family:Arial;background:#87ceeb}
#hud{position:fixed;top:10px;left:10px;z-index:5;color:white;background:#101820dd;padding:12px;border-radius:12px}
#controls{position:fixed;bottom:12px;left:0;width:100%;display:flex;justify-content:space-between;align-items:end;padding:8px;z-index:5;pointer-events:none}
.pad{display:grid;grid-template-columns:repeat(3,55px);gap:5px;pointer-events:auto}
.actions{display:flex;flex-direction:column;gap:7px;pointer-events:auto}
button{border:1px solid #ffffff66;background:#17212ddd;color:white;border-radius:13px;padding:14px;font-size:17px;min-width:52px;touch-action:none}
button:active{background:#e58a24}
#mission{font-size:12px;color:#ffe48a}
</style>
</head>
<body>
<div id="hud">
<b>🏙️ MY OPEN CITY</b><br>
<span id="vehicle">Car selected</span><br>
<span id="mission">Mission: Yellow checkpoint tak jao</span>
</div>
<div id="controls">
 <div class="pad">
  <span></span><button id="up">▲</button><span></span>
  <button id="left">◀</button><button id="stop">■</button><button id="right">▶</button>
  <span></span><button id="down">▼</button><span></span>
 </div>
 <div class="actions">
  <button id="switch">🚗 / 🏍️</button>
  <button id="walk">🚶 Walk / Drive</button>
 </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,70,210);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,500);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x53634a,2));
const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(40,80,30);scene.add(sun);

const mat=(color)=>new THREE.MeshLambertMaterial({color});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(300,300),mat(0x55964b));
ground.rotation.x=-Math.PI/2;ground.position.y=-.1;scene.add(ground);

function cube(w,h,d,color,x,y,z){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color));
 m.position.set(x,y,z);scene.add(m);return m;
}

// Roads
cube(300,.12,18,0x333333,0,.02,0);
cube(18,.12,300,0x333333,0,.02,0);

// Road markings
for(let i=-140;i<145;i+=12){
 cube(5,.04,.3,0xffffff,i,.1,0);
 cube(.3,.04,5,0xffffff,0,.1,i);
}

// Buildings
for(let x=-130;x<=130;x+=22){
 for(let z=-130;z<=130;z+=22){
  if(Math.abs(x)<18||Math.abs(z)<18)continue;
  let h=9+Math.random()*28;
  let colors=[0xc5c5d4,0xd8b99a,0x8cabc4,0xd7d7ca,0x9999aa];
  cube(12,h,12,colors[Math.floor(Math.random()*colors.length)],x,h/2,z);
  for(let y=3;y<h-2;y+=4){
   for(let wx=-4;wx<=4;wx+=4){
    cube(1.2,1.3,.08,0x6ba5c5,x+wx,y,z-6.05);
   }
  }
 }
}

// Player
const player=new THREE.Group();
const body=new THREE.Mesh(new THREE.BoxGeometry(.8,1.3,.5),mat(0x2255dd));
body.position.y=1.25;player.add(body);
const head=new THREE.Mesh(new THREE.SphereGeometry(.38,16,16),mat(0xffc28c));
head.position.y=2.15;player.add(head);
player.position.set(0,0,5);scene.add(player);

// Vehicle creator
function makeVehicle(color,isBike=false){
 const g=new THREE.Group();
 if(!isBike){
  const base=new THREE.Mesh(new THREE.BoxGeometry(2,0.8,4),mat(color));
  base.position.y=.8;g.add(base);
  const top=new THREE.Mesh(new THREE.BoxGeometry(1.55,.8,2),mat(0x8dd8ee));
  top.position.set(0,1.55,-.2);g.add(top);
 }else{
  const base=new THREE.Mesh(new THREE.BoxGeometry(.65,.6,2.5),mat(color));
  base.position.y=1;g.add(base);
  const seat=new THREE.Mesh(new THREE.BoxGeometry(.8,.2,.8),mat(0x222222));
  seat.position.set(0,1.4,.1);g.add(seat);
 }
 for(let x of [-1,1]){
  for(let z of [-1.3,1.3]){
   if(isBike&&x===1)continue;
   const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.4,.4,.25,16),mat(0x111111));
   wheel.rotation.z=Math.PI/2;wheel.position.set(x,.4,z);g.add(wheel);
  }
 }
 return g;
}
const car=makeVehicle(0xdd2929);
const bike=makeVehicle(0x2244dd,true);
car.position.set(0,0,5);bike.position.set(4,0,5);
scene.add(car,bike);

// Traffic cars
const traffic=[];
for(let i=0;i<7;i++){
 let t=makeVehicle(0xe5bd25);
 t.position.set(-100+i*30,0,-8);
 scene.add(t);traffic.push(t);
}

// Checkpoint
const checkpoint=new THREE.Mesh(
 new THREE.TorusGeometry(3,.35,12,32),
 new THREE.MeshBasicMaterial({color:0xffff00})
);
checkpoint.rotation.x=Math.PI/2;
checkpoint.position.set(0,2,-70);scene.add(checkpoint);

let active=car,driving=true,vehicleType="Car";
let speed=0,angle=0;
const keys={};

function bind(id,key){
 const el=document.getElementById(id);
 el.addEventListener("pointerdown",e=>{e.preventDefault();keys[key]=true;});
 ["pointerup","pointercancel","pointerleave"].forEach(ev=>
 el.addEventListener(ev,()=>keys[key]=false));
}
bind("up","up");bind("down","down");
bind("left","left");bind("right","right");

document.getElementById("stop").onclick=()=>speed=0;
document.getElementById("switch").onclick=()=>{
 if(!driving)return;
 active=active===car?bike:car;
 vehicleType=active===car?"Car":"Bike";
 document.getElementById("vehicle").textContent=vehicleType+" selected";
};
document.getElementById("walk").onclick=()=>{
 driving=!driving;
 if(driving){
  active.position.copy(player.position);
  active.position.y=0;
 }else{
  player.position.copy(active.position);
 }
 document.getElementById("vehicle").textContent=driving?vehicleType+" driving":"Walking";
};

const clock=new THREE.Clock();
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);

 if(driving){
  if(keys.up)speed=Math.min(speed+dt*12,22);
  else if(keys.down)speed=Math.max(speed-dt*12,-9);
  else speed*=.97;
  if(keys.left)angle+=dt*1.8;
  if(keys.right)angle-=dt*1.8;
  active.rotation.y=angle;
  active.position.x+=Math.sin(angle)*speed*dt;
  active.position.z+=Math.cos(angle)*speed*dt;
 }else{
  let move=8*dt;
  if(keys.left)player.position.x-=move;
  if(keys.right)player.position.x+=move;
  if(keys.up)player.position.z-=move;
  if(keys.down)player.position.z+=move;
 }
 traffic.forEach(t=>{
  t.position.x+=dt*8;
  if(t.position.x>130)t.position.x=-130;
 });
 checkpoint.rotation.z+=dt*.7;

 const target=driving?active:player;
 const behind=new THREE.Vector3(
  target.position.x-Math.sin(angle)*12,
  target.position.y+8,
  target.position.z+Math.cos(angle)*12
 );
 camera.position.lerp(behind,.08);
 camera.lookAt(target.position.x,target.position.y+1,target.position.z);

 if(target.position.distanceTo(checkpoint.position)<6){
  document.getElementById("mission").textContent="Mission complete! ⭐";
 }
 renderer.render(scene,camera);
}
animate();

window.addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
